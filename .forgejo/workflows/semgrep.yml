# Name of this Forgejo Actions workflow.
name: Semgrep

on:
  # Scan changed files in PRs (diff-aware scanning):
  pull_request: {}
  # Scan on-demand through the Forgejo Actions interface:
  workflow_dispatch: {}
  # Scan mainline branches if there are changes to .forgejo/workflows/semgrep.yml:
  push:
    branches: [ main, feature/* ]
    paths:
      - .forgejo/workflows/semgrep.yml
  # Schedule the CI job (this method uses cron syntax):
  schedule:
    - cron: '8 0 * * *' # Sets Semgrep to scan every day
    # It is recommended to change the schedule to a random time.

permissions:
  contents: read

jobs:
  semgrep:
    # User definable name of this Forgejo Actions job.
    name: semgrep/ci
    # If you are self-hosting, change the following `runs-on` value:
    runs-on: ubuntu-latest

    container:
      # A Docker image with Semgrep installed. Do not change this.
      image: semgrep/semgrep

    # Skip any PR created by dependabot to avoid permission issues:
    if: (forgejo.actor != 'dependabot[bot]')

    steps:
      # Fetch project source with Forgejo Actions Checkout.
      - uses: https://code.forgejo.org/actions/checkout@v4
      # Run the "semgrep ci" command on the command line of the docker image.
      - run: semgrep ci
        env:
          # Connect to Semgrep AppSec Platform through your SEMGREP_APP_TOKEN.
          # Generate a token from Semgrep AppSec Platform > Settings
          # and add it to your Forgejo Actions secrets.
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
