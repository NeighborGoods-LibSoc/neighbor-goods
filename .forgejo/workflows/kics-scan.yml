name: KICS Security Scan

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main, feature/* ]
  # Optional: Allow manual triggering
  workflow_dispatch:

jobs:
  kics-scan:
    name: KICS Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: https://code.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run KICS IaC Scan
        uses: https://github.com/checkmarx/kics-github-action@b974e53df1e3a2cd22ea90f0ec01882394feede4
        continue-on-error: true
        with:
          path: '.'
          output_formats: 'sarif,json'
          output_path: 'kics-results'
          verbose: true

      - name: Fix permissions on output directory
        run: sudo chown -R $USER:$USER kics-results

      - name: Upload KICS Scan results
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        if: always()
        with:
          name: kics-scan-results
          path: kics-results/
          retention-days: 14
